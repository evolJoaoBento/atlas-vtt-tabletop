<!doctype html>
<html><head><meta charset="utf-8"><title>Tabletop board harness</title>
<link rel="stylesheet" href="atlas.css">
<link rel="stylesheet" href="styles.css">
<style>:root{--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-hover:rgba(255,255,255,.08);--text-normal:#dcddde;--text-muted:#9a9a9a;--text-error:#fb464c;--radius-xl:16px;--radius-l:12px;--radius-m:8px;--shadow-l:0 8px 24px rgba(0,0,0,.45);--size-4-1:4px;--size-4-2:8px;--size-4-3:12px;--font-ui-small:13px;--font-ui-smaller:12px;--font-semibold:600;--background-modifier-border:#363636;--interactive-accent:#7c5cff;--divider-color:#363636;--radius-s:4px;--background-secondary-alt:#2b2b2b;--text-on-accent:#ffffff;--interactive-accent-hover:#8e72ff;--radius-m:8px;--background-modifier-active-hover:rgba(255,255,255,.12);--color-red:#fb464c;--color-green:#44cf6e;--text-faint:#666;--font-interface:sans-serif}.clickable-icon{background:transparent;border:none;box-shadow:none;color:var(--text-muted);display:flex;align-items:center;justify-content:center;padding:4px}.clickable-icon:hover{background:var(--background-modifier-hover)}button{background:#ffffff;border:1px solid #cccccc;box-shadow:0 1px 2px #00000033;padding:4px 12px;height:30px;border-radius:4px}input{background:#121212;color:#dcddde;border:1px solid #3a3a3a;border-radius:6px;padding:4px}body{margin:0;background:#111;color:#eee;font:13px sans-serif}#board{position:relative;width:1000px;height:640px}#board canvas{display:block;width:100%;height:100%}</style>
</head><body><div id="board"></div><script src="board.js"></script></body></html>
